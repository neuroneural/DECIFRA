# Sensitivity sweep, vanilla DECIFRA: default (matches paper's pretraining setting).
# Variant axis: sp_weight=1.0, threshold=0.01.

single_embedder: true
single_GRU: true
rnn:
  input_embedding_size: 16
  hidden_size: 32
btp:
  hidden_dim: 32
single_predictor: true
loss:
  threshold: 0.01
  sp_weight: 1.0
  forecast_weight: 1.0
  prediction_delay: 0
  prediction_depth: 1
  weighted_change: false
lr: 0.001
load_pretrained: false
pretrained_path: null
pretraining: true
input_size: 53
output_size: 2
