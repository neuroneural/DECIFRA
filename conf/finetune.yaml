# Root config for scripts/02_finetuning.py
# Usage:
#   python scripts/02_finetuning.py model=DECIFRA dataset=fbirn idx=0
# The pretrained-weights source lives in the model config's `finetune.pretrained`
# block (per-model). Override/sweep it with e.g.
#   model.finetune.pretrained.run=<pretraining run dir>
#   model.finetune.pretrained.load=false   # train classifier from scratch
defaults:
  - model: ???
  - dataset: ???
  - _self_

mode: finetune          # selects the model's 'finetune' delta (see src.registry)

idx: 0
postfix: null
resume: false

train:
  epochs: 200
  batch_size: 64
  n_splits: 5           # outer StratifiedKFold (held-out test per fold)
  n_repeats: 10         # inner StratifiedShuffleSplit (train/val) per fold
  val_size: null        # null => 1/n_splits
  patience: null        # null => patience == epochs
  preserve_checkpoints: false
  zscore: true

hydra:
  run:
    dir: ./assets/utility_logs
  job:
    chdir: false
