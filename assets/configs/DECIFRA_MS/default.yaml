# Default Multistage Configuration
# Stage 1: Independent channels
# Stage 2: Linear unfreezing of cross-channel interactions

# Model identity: class to instantiate + module it lives in (see src.registry).
# model_name is also used for log directory naming.
model_name: DECIFRA_MS
module: DECIFRA_MS

n_training_stages: 2
eps_stage_ratios: [0.3, 0.7]
transition_target_weight: 0.2

# Model architecture settings inherited from vanilla DECIFRA
single_embedder: true
single_GRU: true
rnn:
  input_embedding_size: 16
  hidden_size: 32
btp:
  hidden_dim: 32
single_predictor: true
loss:
  threshold: 0.01
  sp_weight: 1.0
  forecast_weight: 1.0
  prediction_delay: 0
  prediction_depth: 1
  weighted_change: false
lr: 0.001
load_pretrained: false
pretrained_path: null
pretraining: true
input_size: 53
output_size: 2

