# meanLSTM variant mirroring meanGRU/independent_features_shared_dynamics.yaml
model_name: meanLSTM
module: meanLSTM
single_embedder: false
single_LSTM: true
single_predictor: false
rnn:
  input_embedding_size: 16
  hidden_size: 32
  num_layers: 1
  dropout: 0.0
loss:
  prediction_delay: 0
  prediction_depth: 1
  forecast_weight: 1.0
lr: 0.001
